name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: grafana/plugin-actions/build-plugin@release
        with:
          go-version: '1.25'
          node-version: '24'
          # policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
